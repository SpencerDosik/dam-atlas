name: Monthly NID Refresh

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run preprocessing
        run: python scripts/build_geojson.py

      - name: Read preprocessing report
        id: report
        run: |
          echo "body<<EOF" >> $GITHUB_OUTPUT
          cat data/preprocessing-report.json >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "data: monthly NID refresh"
          title: "Monthly NID refresh (${{ github.run_number }})"
          body: |
            Automated monthly refresh of the USACE National Inventory of Dams data.

            ## Preprocessing Report
            ```json
            ${{ steps.report.outputs.body }}
            ```
          branch: nid-refresh/auto
          base: main
          delete-branch: true
          add-paths: |
            data/dams.geojson
            data/dams.details.json
            data/summary.json
            data/riskScore.fixtures.json
            data/preprocessing-report.json
